<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagoda - Under Construction</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: "MS PGothic", "MS Gothic", "Courier New", monospace;
            image-rendering: pixelated;
        }

        .container {
            text-align: center;
            border: 2px solid #ffcc00;
            padding: 40px 60px;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 204, 0, 0.03) 2px,
                rgba(255, 204, 0, 0.03) 4px
            ), #16213e;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #ffcc00;
            margin: 0 0 8px 0;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffcc00, transparent);
            margin: 16px 0;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #b0b0b0;
            margin: 8px 0;
        }

        .blink {
            animation: blink 1s step-end infinite;
            color: #ffcc00;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .construction {
            font-size: 1.4rem;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pagoda</h1>
        <div class="divider"></div>
        <p class="construction">-- under construction --</p>
        <p>a community for the small web</p>
        <p class="blink">[ check back soon ]</p>
    </div>
</body>
</html>
